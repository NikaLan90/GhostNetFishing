<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html" xmlns:f="jakarta.faces.core">
<h:head>
	<title>Übersicht der Geisternetze</title>
</h:head>

<h:body>
	<h1>Übersicht der Geisternetze</h1>

	<p>Diese Tabelle zeigt alle bisher gemeldeten Geisternetze und ihren aktuellen Status.</p>

	<h:form>
		<h:dataTable value="#{ghostNetBean.ghostNets}" var="net" border="1">

			<h:column>
				<f:facet name="header">ID</f:facet>
				#{net.id}
			</h:column>

			<h:column>
				<f:facet name="header">Breitengrad</f:facet>
				#{net.latitude}
			</h:column>

			<h:column>
				<f:facet name="header">Längengrad</f:facet>
				#{net.longitude}
			</h:column>

			<h:column>
				<f:facet name="header">Größe</f:facet>
				#{net.estimatedSize}
			</h:column>

			<h:column>
				<f:facet name="header">Status</f:facet>
				#{net.status}
			</h:column>

			<h:column>
				<f:facet name="header">Bergende Person</f:facet>
				#{net.rescuerName}
			</h:column>

			<h:column>
				<f:facet name="header">Aktion</f:facet>

				<h:commandButton value="Bergung übernehmen"
                 action="#{ghostNetBean.prepareRescue(net.id)}"
                 disabled="#{net.status ne 'GEMELDET'}" />

				<br />

				<h:commandButton value="Als geborgen melden" action="#{ghostNetBean.markRecovered(net.id)}"
					disabled="#{net.status eq 'GEBORGEN' or net.status eq 'VERSCHOLLEN'}" />

				<br />

				<h:commandButton value="Als verschollen melden" action="#{ghostNetBean.markMissing(net.id)}"
					disabled="#{net.status eq 'GEBORGEN' or net.status eq 'VERSCHOLLEN'}" />
			</h:column>

		</h:dataTable>
	</h:form>

	<p>
		<h:link outcome="netzMelden" value="Weiteres Geisternetz melden" />
	</p>

	<p>
		<h:link outcome="index" value="Zur Startseite" />
	</p>
</h:body>

</html>
